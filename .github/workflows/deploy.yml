# Build -> GHCR -> staging (automatic on main) -> production (manual approval, operator only).
# Server side contract: kmplus-deploy-gate forced command, see /usr/local/sbin/kmplus-release on the VPS.
#
# Required repo setup (not in this file):
#   secrets:   STAGING_DEPLOY_KEY, PRODUCTION_DEPLOY_KEY   (ssh private keys pinned per env/service on the VPS)
#              GHCR_TOKEN  (PAT/App token with read+write:packages on the kmplus-consulting org: the image lives
#              there, and this repo's GITHUB_TOKEN cannot write to another org's packages)
#   variables: GHCR_USER   (GitHub user that owns GHCR_TOKEN)
#   variables: VPS_HOST (72.61.214.233), VPS_KNOWN_HOSTS (ssh-keyscan line, verified out of band)
#   environments: "production" with required reviewers
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVICE: injourney-rinjani
  IMAGE: ghcr.io/kmplus-consulting/injourney-rinjani

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy digest to staging
        env:
          KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
          ACTOR: ${{ github.actor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id; chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy@${{ vars.VPS_HOST }} \
            "deploy $SERVICE $IMAGE@$DIGEST $ACTOR"

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production   # required reviewers = the manual approval gate
    steps:
      - name: Promote the staging-verified digest
        env:
          KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          DIGEST: ${{ needs.build.outputs.digest }}
          ACTOR: ${{ github.actor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id; chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy@${{ vars.VPS_HOST }} \
            "promote $SERVICE $DIGEST $ACTOR"
